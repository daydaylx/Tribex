name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ${{ matrix.build-type }} APK
      run: ./gradlew :app:assemble${{ matrix.build-type }} --stacktrace

    - name: Upload ${{ matrix.build-type }} APK
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ matrix.build-type }}
        path: app/build/outputs/apk/${{ matrix.build-type }}/*.apk
        retention-days: 7

    - name: Run Unit Tests
      run: ./gradlew test --continue --stacktrace

    - name: Run Detekt
      run: ./gradlew detekt --stacktrace

    - name: Run Native Tests
      run: ./gradlew nativeTest --continue --stacktrace

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.build-type }}
        path: |
          app/build/reports/tests/
          app/build/test-results/
        retention-days: 7

    - name: Upload Native Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-test-results-${{ matrix.build-type }}
        path: app/build/native-tests/
        retention-days: 7

    - name: Upload Detekt Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: detekt-report-${{ matrix.build-type }}
        path: app/build/reports/detekt/
        retention-days: 7
